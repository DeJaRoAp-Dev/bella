<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>El mar insiste | One Piece</title>
</head>
<body>
    <main class="container">
        <div class="badges">
            <span class="badge badge-pirate">☠ GRAND LINE</span>
            <span class="badge badge-romance">🌀 INSISTE</span>
        </div>

        <figure class="gif-frame">
            <img src="jaxponmi.png" alt="Jax y Pomni abrazándose">
            <figcaption>JAX &amp; POMNI</figcaption>
        </figure>

        <h1>Te rindas hoy o te rindas mañana...😈 todos los caminos posibles terminan en ti, estas destinada a ser mia para siempre.</h1>
        <p>El Grand Line no acepta un “no” tan fácil... 🌊 ¿Qué tal si le das otra oportunidad al destino?</p>

        <div class="btn">
            <a href="si.html">¡SÍ, NAKAMA!</a>
            <a href="#" id="btn-random">NO</a>
        </div>
    </main>

    <!-- Música de fondo: coloca tu canción en esta carpeta con el nombre musica.mp3 -->
    <audio id="bg-music" src="musica.mp3" loop preload="auto" autoplay></audio>
    <button class="music-btn" id="music-toggle" type="button" aria-label="Reproducir música de fondo">
        <span class="note" aria-hidden="true">♪</span>
        <span class="label">Música</span>
    </button>

    <script src="script.js"></script>
</body>
</html>
